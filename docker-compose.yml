services:
  # Nginx web server
  nginx:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - php
    networks:
      - it302_network

  # PHP 8.2 with FPM - Custom build with all extensions
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: php_fpm
    volumes:
      - ./app:/var/www/html
      - ./php/conf.d:/usr/local/etc/php/conf.d
    depends_on:
      - mysql
    networks:
      - it302_network

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: it302_anong
      MYSQL_DATABASE: it302_anong
      MYSQL_USER: it302_anong
      MYSQL_PASSWORD: it302_anong
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - it302_network
    command: --default-authentication-plugin=mysql_native_password

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 100M
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - it302_network

  # Redis cache
  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - it302_network

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - it302_network

networks:
  it302_network:
    driver: bridge