services:
  # Nginx web server
  nginx:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - php
    networks:
      - web_network

  # PHP 8.2 with FPM - Custom build with all extensions
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: php_fpm
    volumes:
      - ./app:/var/www/html
      - ./php/conf.d:/usr/local/etc/php/conf.d
    depends_on:
      - mysql
    networks:
      - web_network

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: default
      MYSQL_DATABASE: default
      MYSQL_USER: default
      MYSQL_PASSWORD: default
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - web_network
    command: --default-authentication-plugin=mysql_native_password

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 100M
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - web_network

  # Workspace container for development tools
  workspace:
    image: devilbox/php-fpm:8.2-work
    container_name: workspace
    environment:
      - PHP_IDE_CONFIG=serverName=localhost
    volumes:
      - ./app:/var/www/html
      - ./workspace:/home/workspace
      - ./workspace/.bashrc:/home/.bashrc
      - ./workspace/.gitconfig:/home/.gitconfig
    working_dir: /var/www/html
    stdin_open: true
    tty: true
    depends_on:
      - php
      - mysql
    networks:
      - web_network

  # Redis cache
  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - web_network

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - web_network

networks:
  web_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local